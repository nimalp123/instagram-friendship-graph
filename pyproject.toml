[project]
name = "instagram-friendship-graph"
version = "0.1.0"
description = "Map your 1st, 2nd, and 3rd degree friends and uncover hidden mutuals in Obsidian"
requires-python = ">=3.10"

[project.scripts]
friendship-graph = "friendship_graph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["friendship_graph*"]
